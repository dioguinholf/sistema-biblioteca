<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="marca">UFRPE · v1.2.0</span>
    <h1>Biblioteca</h1>
    <nav>
      <button class="aba ativa" data-aba="livros">Livros</button>
      <button class="aba" data-aba="usuarios">Usuários</button>
    </nav>
  </header>

  <div id="mensagem" class="mensagem oculto"></div>

  <main>
    <!-- LIVROS -->
    <section id="livros" class="painel">
      <form id="form-livro" class="card">
        <h2>Cadastrar livro</h2>
        <div class="campos">
          <input name="isbn" placeholder="ISBN" required>
          <input name="titulo" placeholder="Título" required>
          <input name="autor" placeholder="Autor" required>
          <input name="ano" type="number" placeholder="Ano" required>
        </div>
        <button type="submit">Cadastrar</button>
      </form>

      <div class="card">
        <h2>Acervo</h2>
        <form id="form-busca" class="busca">
          <select name="tipo">
            <option value="titulo">Título</option>
            <option value="autor">Autor</option>
            <option value="isbn">ISBN</option>
          </select>
          <input name="termo" placeholder="Buscar no acervo…">
          <button type="submit">Buscar</button>
        </form>
        <table>
          <thead><tr><th>ISBN</th><th>Título</th><th>Autor</th><th>Ano</th><th></th></tr></thead>
          <tbody id="tabela-livros"></tbody>
        </table>
      </div>
    </section>

    <!-- USUÁRIOS -->
    <section id="usuarios" class="painel oculto">
      <form id="form-usuario" class="card">
        <h2>Cadastrar usuário</h2>
        <div class="campos">
          <input name="nome" placeholder="Nome" required>
          <input name="email" type="email" placeholder="E-mail" required>
          <input name="telefone" placeholder="Telefone com DDD" required>
        </div>
        <button type="submit">Cadastrar</button>
      </form>

      <div class="card">
        <h2>Usuários</h2>
        <table>
          <thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Telefone</th><th></th></tr></thead>
          <tbody id="tabela-usuarios"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
